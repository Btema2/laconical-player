name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle home
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-home-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-home-

      - name: Cache Gradle build cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/build-cache
          key: ${{ runner.os }}-gradle-build-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install Android SDK platform 35
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

      - name: Run lint
        run: ./gradlew lint --no-daemon --parallel --stacktrace

      - name: Run unit tests
        run: ./gradlew :core:media:test --no-daemon --parallel --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --parallel --stacktrace

      - name: Submit dependency graph
        if: github.event_name == 'push'
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: laconical-player-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          retention-days: 30

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: core/media/build/reports/tests/
          retention-days: 30
